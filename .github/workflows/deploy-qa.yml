name: Deploy QA Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VAR_AWS_REGION: ${{ secrets.TF_VAR_AWS_REGION }}
  TF_VAR_AWS_KEY_PAIR_NAME: ${{ secrets.TF_VAR_AWS_KEY_PAIR_NAME }}
  TF_VAR_AWS_INSTANCE_TYPE: ${{ secrets.TF_VAR_AWS_INSTANCE_TYPE }}
  TF_VAR_NODE_APP_EMAIL: ${{ secrets.TF_VAR_NODE_APP_EMAIL }}
  TF_VAR_NODE_APP_PASSWORD: ${{ secrets.TF_VAR_NODE_APP_PASSWORD }}
  TF_VAR_NODE_APP_SERVICE: ${{ secrets.TF_VAR_NODE_APP_SERVICE }}
  TF_VAR_AWS_ENVIRONMENT: "qa"
  TF_VAR_AWS_SERVER_NAME: "draftbook-qa-server"
  TF_VAR_AWS_SG: ${{ secrets.TF_VAR_AWS_SG }}
  TF_VAR_MAIN_DOMAIN: ${{ secrets.TF_VAR_MAIN_DOMAIN }}

jobs:
  terraform-plan:
    name: Terraform Plan (QA)
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.TF_VAR_AWS_REGION }}
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create SSH Keys from secrets
        run: |
          mkdir -p ./envs/qa/keys
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ./envs/qa/keys/draftbook_app_key
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ./envs/qa/keys/draftbook_app_key.pub
          chmod 600 ./envs/qa/keys/draftbook_app_key
          chmod 644 ./envs/qa/keys/draftbook_app_key.pub

      - name: Upload SSH Keys
        uses: actions/upload-artifact@v4
        with:
          name: ssh-keys-qa
          path: ./envs/qa/keys

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.2
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform -chdir=envs/qa init

      - name: Terraform Validate
        run: terraform -chdir=envs/qa validate

      - name: Terraform Plan
        run: terraform -chdir=envs/qa plan -out=plan.out

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-qa
          path: envs/qa/plan.out
          if-no-files-found: error

  terraform-apply:
    name: Terraform Apply (QA)
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: qa
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.TF_VAR_AWS_REGION }}
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SSH Keys
        uses: actions/download-artifact@v4
        with:
          name: ssh-keys-qa
          path: ./envs/qa/keys

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.2
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform -chdir=envs/qa init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tf-plan-qa
          path: envs/qa

      - name: Terraform Apply
        run: terraform -chdir=envs/qa apply -auto-approve plan.out
