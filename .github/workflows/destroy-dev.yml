name: Destroy Dev Infrastructure
on:
    workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
  TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_aws_region: ${{ secrets.TF_VAR_AWS_REGION }}
  TF_VAR_aws_key_pair_name: ${{ secrets.TF_VAR_AWS_KEY_PAIR_NAME }}
  TF_VAR_aws_instance_type: ${{ secrets.TF_VAR_AWS_INSTANCE_TYPE }}
  TF_VAR_aws_draftbook_sg: ${{ secrets.TF_VAR_AWS_SG }}
  TF_VAR_aws_server_name: "draftbook-dev-server"
  TF_VAR_aws_environment: "dev"
  TF_VAR_NODE_APP_EMAIL: ${{ secrets.TF_VAR_NODE_APP_EMAIL }}
  TF_VAR_NODE_APP_PASSWORD: ${{ secrets.TF_VAR_NODE_APP_PASSWORD }}
  TF_VAR_NODE_APP_SERVICE: ${{ secrets.TF_VAR_NODE_APP_SERVICE }}
  TF_VAR_MAIN_DOMAIN: ${{ secrets.TF_VAR_MAIN_DOMAIN }}

jobs:
    terraform-destroy:
        name: Terraform Destroy
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ secrets.AWS_ROLE }}
                aws-region: ${{ secrets.TF_VAR_AWS_REGION }}
            
            - name: Verify S3 Backend Bucket
              run: |
                echo "📦 Verificando bucket S3 para Terraform state..."
                BUCKET_NAME="draftbook-terraform-state"
                
                if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
                  echo "✅ Bucket $BUCKET_NAME existe"
                else
                  echo "❌ ERROR: Bucket $BUCKET_NAME no existe"
                  echo "   El state de Terraform no se puede acceder"
                  exit 1
                fi
            
            - name: Create SSH Keys from secrets (no longer needed but kept for compatibility)
              run: |
                mkdir -p ./envs/dev/keys
                printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ./envs/dev/keys/draftbook_KEYPAR.pem
                chmod 600 ./envs/dev/keys/draftbook_KEYPAR.pem
                echo "SSH key created (not used during destroy)"
              
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                terraform_version: 1.9.2
                terraform_wrapper: false
            
            - name: Terraform Init & Destroy
              run: terraform -chdir=envs/dev init
            - name: Terraform Destroy
              run: terraform -chdir=envs/dev destroy -auto-approve
