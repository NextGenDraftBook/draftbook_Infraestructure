name: Deploy Prod Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VAR_AWS_REGION: ${{ secrets.TF_VAR_AWS_REGION }}
  TF_VAR_AWS_KEY_PAIR_NAME: ${{ secrets.TF_VAR_AWS_KEY_PAIR_NAME }}
  TF_VAR_AWS_INSTANCE_TYPE: ${{ secrets.TF_VAR_AWS_INSTANCE_TYPE_PROD || 't3.medium' }}
  TF_VAR_NODE_APP_EMAIL: ${{ secrets.TF_VAR_NODE_APP_EMAIL }}
  TF_VAR_NODE_APP_PASSWORD: ${{ secrets.TF_VAR_NODE_APP_PASSWORD }}
  TF_VAR_NODE_APP_SERVICE: ${{ secrets.TF_VAR_NODE_APP_SERVICE }}
  TF_VAR_AWS_ENVIRONMENT: "prod"
  TF_VAR_AWS_SERVER_NAME: "draftbook-prod-server"
  TF_VAR_AWS_SG: ${{ secrets.TF_VAR_AWS_SG }}
  TF_VAR_MAIN_DOMAIN: ${{ secrets.TF_VAR_MAIN_DOMAIN }}

jobs:
  terraform-plan:
    name: Terraform Plan (Prod)
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.TF_VAR_AWS_REGION }}
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create SSH Keys from secrets
        run: |
          mkdir -p ./envs/prod/keys
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ./envs/prod/keys/draftbook_app_key
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ./envs/prod/keys/draftbook_app_key.pub
          chmod 600 ./envs/prod/keys/draftbook_app_key
          chmod 644 ./envs/prod/keys/draftbook_app_key.pub

      - name: Upload SSH Keys
        uses: actions/upload-artifact@v4
        with:
          name: ssh-keys-prod
          path: ./envs/prod/keys

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.2
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform -chdir=envs/prod init

      - name: Terraform Validate
        run: terraform -chdir=envs/prod validate

      - name: Terraform Plan
        run: terraform -chdir=envs/prod plan -out=plan.out

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-prod
          path: envs/prod/plan.out
          if-no-files-found: error

  terraform-apply:
    name: Terraform Apply (Prod)
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.TF_VAR_AWS_REGION }}
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SSH Keys
        uses: actions/download-artifact@v4
        with:
          name: ssh-keys-prod
          path: ./envs/prod/keys

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.2
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform -chdir=envs/prod init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tf-plan-prod
          path: envs/prod

      - name: Terraform Apply
        run: terraform -chdir=envs/prod apply -auto-approve plan.out
        
      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          cd envs/prod
          echo "server_ip=$(terraform output -raw server_ip 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
        continue-on-error: true
