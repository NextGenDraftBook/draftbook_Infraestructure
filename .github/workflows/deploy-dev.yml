name: Deploy Dev Infrastructure

on:
  workflow_dispatch:  # Solo manual
  push:
    branches:
      - main
      - feature/SCRUM-49

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VAR_aws_region: ${{ secrets.TF_VAR_AWS_REGION }}
  TF_VAR_aws_key_pair_name: ${{ secrets.TF_VAR_AWS_KEY_PAIR_NAME }}
  TF_VAR_aws_instance_type: ${{ secrets.TF_VAR_AWS_INSTANCE_TYPE }}
  TF_VAR_aws_draftbook_sg: ${{ secrets.TF_VAR_AWS_SG }}
  TF_VAR_aws_server_name: "draftbook-dev-server"
  TF_VAR_aws_environment: "dev"

jobs:
  terraform-plan:
    name: Terraform Plan (Dev)
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.TF_VAR_AWS_REGION }}
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create SSH Keys from secrets
        run: |
          mkdir -p ./envs/dev/keys
          
          # Intentar decodificar base64 primero (si el secreto está en base64)
          # Si falla, usar el secreto directamente
          if echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > /dev/null 2>&1; then
            echo "🔓 Decodificando llave desde Base64..."
            echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ./envs/dev/keys/draftbook_KEYPAR.pem
          else
            echo "📝 Usando llave en formato texto..."
            printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ./envs/dev/keys/draftbook_KEYPAR.pem
          fi
          
          chmod 600 ./envs/dev/keys/draftbook_KEYPAR.pem
          
          # Verificar que la llave se creó correctamente
          echo ""
          echo "=== Contenido del directorio de llaves ==="
          ls -la ./envs/dev/keys/
          echo ""
          echo "=== Primera línea de la llave privada ==="
          head -1 ./envs/dev/keys/draftbook_KEYPAR.pem
          echo ""
          echo "=== Última línea de la llave privada ==="
          tail -1 ./envs/dev/keys/draftbook_KEYPAR.pem
          echo ""
          echo "=== Número de líneas ==="
          wc -l ./envs/dev/keys/draftbook_KEYPAR.pem
          echo ""
          echo "=== Verificación completa de la llave ==="
          chmod +x .github/verify-ssh-key.sh
          .github/verify-ssh-key.sh ./envs/dev/keys/draftbook_KEYPAR.pem || echo "⚠️ La verificación con ssh-keygen falló, pero continuamos"

      - name: Upload SSH Keys
        uses: actions/upload-artifact@v4
        with:
          name: ssh-keys-dev
          path: ./envs/dev/keys/draftbook_KEYPAR.pem

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.2
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform -chdir=envs/dev init

      - name: Terraform Format Check
        run: terraform -chdir=envs/dev fmt -check
        continue-on-error: true

      - name: Terraform Validate
        run: terraform -chdir=envs/dev validate

      - name: Terraform Plan
        run: terraform -chdir=envs/dev plan -out=plan.out

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-dev                
          path: envs/dev/plan.out      
          if-no-files-found: error

  terraform-apply:
    name: Terraform Apply (Dev)
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.TF_VAR_AWS_REGION }}
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SSH Keys
        uses: actions/download-artifact@v4
        with:
          name: ssh-keys-dev
          path: ./envs/dev/keys

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.2
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform -chdir=envs/dev init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tf-plan-dev
          path: envs/dev

      - name: Terraform Apply
        run: terraform -chdir=envs/dev apply -auto-approve plan.out

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          cd envs/dev
          echo "server_ip=$(terraform output -raw vm-linux-server-ip 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Comment PR with outputs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Apply - Dev Environment 🚀
            **Server IP:** \`${{ steps.tf_outputs.outputs.server_ip }}\`
            
            Infrastructure deployed successfully!`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
