name: Deploy Dev Infrastructure

on:
  workflow_dispatch:  # Solo manual
  push:
    branches:
      - main
      - feature/SCRUM-49

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VAR_AWS_REGION: ${{ secrets.TF_VAR_AWS_REGION }}
  TF_VAR_AWS_KEY_PAIR_NAME: ${{ secrets.TF_VAR_AWS_KEY_PAIR_NAME }}
  TF_VAR_AWS_INSTANCE_TYPE: ${{ secrets.TF_VAR_AWS_INSTANCE_TYPE }}
  TF_VAR_NODE_APP_EMAIL: ${{ secrets.TF_VAR_NODE_APP_EMAIL }}
  TF_VAR_NODE_APP_PASSWORD: ${{ secrets.TF_VAR_NODE_APP_PASSWORD }}
  TF_VAR_NODE_APP_SERVICE: ${{ secrets.TF_VAR_NODE_APP_SERVICE }}
  TF_VAR_AWS_ENVIRONMENT: "dev"
  TF_VAR_AWS_SERVER_NAME: "draftbook-dev-server"
  TF_VAR_AWS_SG: ${{ secrets.TF_VAR_AWS_SG }}
  TF_VAR_MAIN_DOMAIN: ${{ secrets.TF_VAR_MAIN_DOMAIN }}

jobs:
  terraform-plan:
    name: Terraform Plan (Dev)
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.TF_VAR_AWS_REGION }}
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create SSH Keys from secrets
        run: |
          mkdir -p ./envs/dev/keys
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ./envs/dev/keys/draftbook_app_key
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ./envs/dev/keys/draftbook_app_key.pub
          chmod 600 ./envs/dev/keys/draftbook_app_key
          chmod 644 ./envs/dev/keys/draftbook_app_key.pub

      - name: Upload SSH Keys
        uses: actions/upload-artifact@v4
        with:
          name: ssh-keys-dev
          path: ./envs/dev/keys

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.2
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform -chdir=envs/dev init

      - name: Terraform Format Check
        run: terraform -chdir=envs/dev fmt -check
        continue-on-error: true

      - name: Terraform Validate
        run: terraform -chdir=envs/dev validate

      - name: Terraform Plan
        run: terraform -chdir=envs/dev plan -out=plan.out

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-dev                
          path: envs/dev/plan.out      
          if-no-files-found: error

  terraform-apply:
    name: Terraform Apply (Dev)
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.TF_VAR_AWS_REGION }}
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SSH Keys
        uses: actions/download-artifact@v4
        with:
          name: ssh-keys-dev
          path: ./envs/dev/keys

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.2
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform -chdir=envs/dev init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tf-plan-dev
          path: envs/dev

      - name: Terraform Apply
        run: terraform -chdir=envs/dev apply -auto-approve plan.out

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          cd envs/dev
          echo "server_ip=$(terraform output -raw server_ip 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Comment PR with outputs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Apply - Dev Environment 🚀
            **Server IP:** \`${{ steps.tf_outputs.outputs.server_ip }}\`
            
            Infrastructure deployed successfully!`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
