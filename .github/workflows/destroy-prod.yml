name: Destroy Prod Infrastructure
on:
    workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_AWS_REGION: ${{ secrets.TF_VAR_AWS_REGION }}
  TF_VAR_AWS_KEY_PAIR_NAME: ${{ secrets.TF_VAR_AWS_KEY_PAIR_NAME }}
  TF_VAR_AWS_INSTANCE_TYPE: ${{ secrets.TF_VAR_AWS_INSTANCE_TYPE_PROD || 't3.medium' }}
  TF_VAR_NODE_APP_EMAIL: ${{ secrets.TF_VAR_NODE_APP_EMAIL }}
  TF_VAR_NODE_APP_PASSWORD: ${{ secrets.TF_VAR_NODE_APP_PASSWORD }}
  TF_VAR_NODE_APP_SERVICE: ${{ secrets.TF_VAR_NODE_APP_SERVICE }}
  TF_VAR_AWS_ENVIRONMENT: "prod"
  TF_VAR_AWS_SERVER_NAME: "draftbook-prod-server"
  TF_VAR_AWS_RESTAURANT_SG: ${{ secrets.TF_VAR_AWS_RESTAURANT_SG }}
  TF_VAR_MAIN_DOMAIN: ${{ secrets.TF_VAR_MAIN_DOMAIN }}

jobs:
    terraform-destroy:
        name: Terraform Destroy (Prod)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ secrets.AWS_ROLE }}
                aws-region: ${{ secrets.TF_VAR_AWS_REGION }}
            
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                terraform_version: 1.9.2
                terraform_wrapper: false
            
            - name: Terraform Init and Destroy
              run: |
                terraform -chdir=envs/prod init
                terraform -chdir=envs/prod destroy -auto-approve
