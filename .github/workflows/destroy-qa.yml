name: Destroy QA Infrastructure
on:
    workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
  TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_aws_region: ${{ secrets.TF_VAR_AWS_REGION }}
  TF_VAR_aws_key_pair_name: ${{ secrets.TF_VAR_AWS_KEY_PAIR_NAME }}
  TF_VAR_aws_instance_type: ${{ secrets.TF_VAR_AWS_INSTANCE_TYPE }}
  TF_VAR_aws_draftbook_sg: ${{ secrets.TF_VAR_AWS_SG }}
  TF_VAR_aws_server_name: "draftbook-qa-server"
  TF_VAR_aws_environment: "qa"
  TF_VAR_NODE_APP_EMAIL: ${{ secrets.TF_VAR_NODE_APP_EMAIL }}
  TF_VAR_NODE_APP_PASSWORD: ${{ secrets.TF_VAR_NODE_APP_PASSWORD }}
  TF_VAR_NODE_APP_SERVICE: ${{ secrets.TF_VAR_NODE_APP_SERVICE }}
  TF_VAR_MAIN_DOMAIN: ${{ secrets.TF_VAR_MAIN_DOMAIN }}

jobs:
    terraform-destroy:
        name: Terraform Destroy (QA)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ secrets.AWS_ROLE }}
                aws-region: ${{ secrets.TF_VAR_AWS_REGION }}
            
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                terraform_version: 1.9.2
                terraform_wrapper: false
            
            - name: Terraform Init and Destroy
              run: |
                terraform -chdir=envs/qa init
                terraform -chdir=envs/qa destroy -auto-approve
